[project]
name = "knowledge-base"
version = "0.1.0"
description = "Redis-backed knowledge base MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
